<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>자립 방탈출 2D (포켓몬 옐로우 GBC) - 하람이의 자립 여정 | 자립해봄</title>
<meta name="description" content="100% 포켓몬스터 옐로우/레드 Game Boy Color 스타일 픽셀 도트 2D 방탈출 RPG 게임. 하람이와 팔로워 콤비로 15개 방을 탈출하세요.">
<meta name="theme-color" content="#854d0e">
<meta property="og:title" content="자립 방탈출 2D (포켓몬 옐로우 GBC)">
<meta property="og:description" content="포켓몬스터 옐로우 버전을 그대로 재현한 8-bit 도트 타일맵 자립 방탈출 RPG!">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&family=Noto+Sans+KR:wght@500;700;800&display=swap');

:root{
  --gbc-bg:#0d1117;
  --gbc-shell:#eab308;
  --gbc-screen-bg:#fff1f2;
  --gbc-border:#713f12;
  --txt:#1e293b;
  --txt-light:#f8fafc;
  --poke-red:#dc2626;
  --poke-blue:#2563eb;
  --poke-yellow:#facc15;
  --font-game:'DungGeunMo', 'Press Start 2P', monospace, sans-serif;
  --font-body:'Noto Sans KR', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background-color:var(--gbc-bg);color:var(--txt-light);font-family:var(--font-body);overflow-x:hidden}

.wrap{max-width:820px;margin:0 auto;padding:10px;display:flex;flex-direction:column;min-height:100dvh;align-items:center}

/* ===== Top Header ===== */
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#1e293b;border:2px solid #334155;border-radius:14px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-game);font-size:1.1rem;color:var(--poke-yellow)}
.tb-actions{display:flex;gap:8px}
.btn-icon{padding:6px 14px;border-radius:8px;border:2px solid #475569;background:#0f172a;color:#fff;font-family:var(--font-game);font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}

/* ===== Game Boy Color Hardware Shell ===== */
.gbc-hardware{
  position:relative;width:100%;max-width:720px;background:var(--gbc-shell);border:6px solid var(--gbc-border);
  border-radius:24px 24px 60px 24px;padding:18px;box-shadow:0 25px 60px rgba(0,0,0,0.9);
  display:flex;flex-direction:column;gap:12px;
}
.gbc-header-label{display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-family:var(--font-game);font-size:0.75rem;color:#713f12;font-weight:800}

/* ===== GBC Screen Bezel ===== */
.screen-bezel{
  background:#1e293b;border:4px solid #0f172a;border-radius:14px;padding:12px;
  box-shadow:inset 0 0 15px rgba(0,0,0,0.8);display:flex;flex-direction:column;gap:8px;
}
.screen-top-hud{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:6px 12px;border-radius:8px;border:1px solid #334155}
.stage-tag{font-family:var(--font-game);color:var(--poke-yellow);font-size:0.95rem}
.stage-name-text{font-size:0.9rem;font-weight:700;color:#fff}
.key-badge{padding:3px 8px;border-radius:6px;font-size:0.78rem;font-weight:800;background:#334155;color:#94a3b8;font-family:var(--font-game)}
.key-badge.has-key{background:rgba(34,197,94,0.25);color:#4ade80;border:1px solid #4ade80;animation:pulseKey 1.5s infinite}
@keyframes pulseKey{50%{transform:scale(1.05)}}

/* ===== Viewport Canvas ===== */
.viewport-frame{position:relative;width:100%;aspect-ratio:10/9;max-height:450px;background:#fff1f2;border-radius:8px;overflow:hidden;border:3px solid #000}
canvas#gbcCanvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* ===== Pokemon Dialogue Box (Classic GBC White/Black Box) ===== */
.poke-dialogue-box{
  background:#ffffff;color:#0f172a;border:4px solid #0f172a;border-radius:10px;
  padding:12px 14px;min-height:84px;font-family:var(--font-game);font-size:1rem;line-height:1.55;
  position:relative;box-shadow:inset 0 0 0 2px #e2e8f0;display:flex;flex-direction:column;justify-content:space-between;
}
.poke-dialogue-box .speaker{color:var(--poke-red);font-weight:800;font-size:0.85rem;margin-bottom:2px}
.poke-dialogue-box .arrow-down{align-self:flex-end;color:var(--poke-red);font-size:1.1rem;animation:bounceArrow .6s infinite alternate}
@keyframes bounceArrow{from{transform:translateY(0)}to{transform:translateY(4px)}}

/* ===== GBC Buttons Pad ===== */
.gbc-controls{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-top:4px}
.dpad-cross{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
.btn-cross{width:44px;height:44px;background:#334155;border:2px solid #1e293b;border-radius:8px;color:#fff;font-family:var(--font-game);font-size:1.1rem;display:grid;place-items:center;user-select:none;touch-action:manipulation;cursor:pointer}
.btn-cross:active{background:var(--poke-blue);transform:scale(0.95)}
.btn-cross.blank{visibility:hidden;border:none;background:none}

.ab-group{display:flex;gap:14px;transform:rotate(-12deg)}
.btn-round{width:56px;height:56px;border-radius:50%;background:#991b1b;border:3px solid #fecdd3;color:#fff;font-family:var(--font-game);font-size:1.1rem;box-shadow:0 5px 0 #7f1d1d;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.btn-round:active{transform:translateY(3px);box-shadow:0 2px 0 #7f1d1d}
.btn-round.btn-b{background:#1e40af;border-color:#bfdbfe;box-shadow:0 5px 0 #1e3a8a}

/* ===== Quiz Modal ===== */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.25s ease}
.modal-mask.open{opacity:1;pointer-events:all}
.modal-box{width:100%;max-width:540px;background:#1e293b;border:3px solid var(--poke-yellow);border-radius:20px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,0.9);position:relative;max-height:90vh;overflow-y:auto;color:#fff}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid #475569;background:#0f172a;color:#fff;cursor:pointer}
.modal-title{font-family:var(--font-game);color:var(--poke-yellow);font-size:1.1rem;margin-bottom:8px}
.modal-desc{font-size:0.88rem;color:#94a3b8;margin-bottom:14px;line-height:1.6}

.input-row{display:flex;gap:10px;margin-bottom:12px}
.quiz-input{flex:1;padding:12px 16px;border-radius:12px;border:2px solid #475569;background:#0f172a;color:#fff;font-size:1rem;outline:none;font-family:var(--font-body)}
.btn-submit{padding:12px 22px;border:none;border-radius:12px;background:var(--poke-yellow);color:#111;font-weight:800;font-size:1rem;cursor:pointer}

.choice-list{display:grid;gap:9px}
.choice-btn{padding:12px 16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#fff;text-align:left;font-size:0.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
.choice-btn:hover{border-color:var(--poke-yellow);background:#1e293b}

.feedback-msg{margin-top:12px;font-size:0.92rem;font-weight:700;display:flex;align-items:center;gap:8px}
.feedback-msg.ok{color:#4ade80}
.feedback-msg.no{color:#f87171}
.hint-text{margin-top:10px;padding:10px 14px;border-radius:10px;background:rgba(250,204,21,0.1);border:1px dashed var(--poke-yellow);font-size:0.86rem;color:var(--poke-yellow)}

/* ===== Win Panel ===== */
.win-panel{padding:28px;text-align:center;background:#1e293b;border:4px solid var(--poke-yellow);border-radius:24px;margin-top:16px}
.win-title{font-family:var(--font-game);color:var(--poke-yellow);font-size:1.5rem;margin-bottom:10px}
.win-desc{color:#94a3b8;line-height:1.7;margin-bottom:18px}
.btn-restart{padding:14px 28px;border-radius:14px;border:none;background:var(--poke-yellow);color:#111;font-family:var(--font-game);font-size:1.05rem;cursor:pointer}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">⚡ 포켓몬스터 옐로우 GBC <span>(자립 방탈출)</span></div>
    <div class="tb-actions">
      <a class="btn-icon" href="/">🏠 대시보드</a>
    </div>
  </header>

  <!-- Game Boy Color Hardware Shell -->
  <div class="gbc-hardware">
    <div class="gbc-header-label">
      <span>GAME BOY COLOR</span>
      <span>POWER ●</span>
    </div>

    <!-- Screen Bezel -->
    <div class="screen-bezel">
      <div class="screen-top-hud">
        <div class="stage-tag">ROOM <span id="hudStageNum">01</span> / 15</div>
        <div class="stage-name-text" id="hudStageTitle">그룹홈 나의 방</div>
        <div class="key-badge" id="hudKeyBadge">🔒 열쇠 미보유</div>
      </div>

      <div class="viewport-frame">
        <canvas id="gbcCanvas" width="320" height="288"></canvas>
      </div>

      <div class="poke-dialogue-box">
        <div class="speaker" id="pokeSpeaker">⚡ 하람과 파트너 콤비</div>
        <div class="text" id="pokeText">방향키(↑↓←→)로 하람이를 움직여 가구 및 NPC를 조사하세요! [A/E]버튼으로 조사합니다.</div>
        <div class="arrow-down">▼</div>
      </div>
    </div>

    <!-- Game Boy Controls -->
    <div class="gbc-controls">
      <div class="dpad-cross">
        <button class="btn-cross blank"></button>
        <button class="btn-cross" id="btnUp">▲</button>
        <button class="btn-cross blank"></button>
        <button class="btn-cross" id="btnLeft">◀</button>
        <button class="btn-cross blank"></button>
        <button class="btn-cross" id="btnRight">▶</button>
        <button class="btn-cross blank"></button>
        <button class="btn-cross" id="btnDown">▼</button>
        <button class="btn-cross blank"></button>
      </div>

      <div class="ab-group">
        <button class="btn-round btn-b" id="btnB">B</button>
        <button class="btn-round" id="btnA">A</button>
      </div>
    </div>
  </div>

  <!-- Win Panel -->
  <div id="winPanel" class="win-panel hidden">
    <div class="win-title">🎉 15개 챕터 완벽 탈출 성공!</div>
    <p class="win-desc">하람이는 15개 방을 모두 탐험하며 수많은 지지와 실제 자립 지원 정책들을 발견했습니다.<br>당당한 자립의 문을 연 하람이의 새 출발을 축하해 주세요!</p>
    <button class="btn-restart" id="btnRestart">🔄 처음부터 다시하기</button>
  </div>
</div>

<!-- Interactive Quiz Modal -->
<div class="modal-mask" id="quizModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle">🔑 열쇠 획득 퀴즈</div>
    <div class="modal-subtitle" id="modalSub"></div>
    <div class="quiz-q" id="modalQ"></div>
    <div id="modalContent"></div>
    <div class="feedback-msg" id="modalFeedback"></div>
    <div class="hint-text hidden" id="modalHint"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- STAGES Data (15 Pokemon GBC Story Rooms) ---------- */
const STAGES = [

    q:"2021년, '보호종료아동'을 대신해 스스로 설 것을 준비한다는 의미로 바뀐 <span class='hi'>여섯 글자</span> 단어는?",
    accept:["자립준비청년","자립준비 청년"], type:"input", hints:["'자립'으로 시작하는 여섯 글자."],
    npc: { name:'원장님', x:160, y:120, color:'#dc2626' },

  {
    num:2, name:"떠남과 머묾 사이", kicker:"CHAPTER 02 · 그룹홈 거실", theme:'room',

    q:"본인이 원하면 <span class='hi'>만 몇 세까지 보호를 연장</span>할 수 있을까? (숫자만)",

    q:"서울시 자립역량 교육의 이름은? (‘<span class='hi'>○○마켓</span>’ — 빈칸 두 글자)",

    npc: { name:'담당강사', x:160, y:110, color:'#2563eb' },

      { id:'board', name:'강의 칠판', x:90, y:110, type:'clue', emoji:'🏫', hint:'칠판에 적힌 자립 교육명을 보자.' },

/* ---------- Game Engine State & Preloaded Assets ---------- */
const state = {
  stageIdx: 0,
  hasKey: false,
  player: { x: 50, y: 140, facing: 'down' },
  follower: { x: 30, y: 140 },
  keys: { up: false, down: false, left: false, right: false },
  bgImages: {},
  avatarImage: new Image()
};

const el = (id) => document.getElementById(id);
const canvas = el('gbcCanvas');
const ctx = canvas.getContext('2d');

/* Preload All 15 Room Assets & Haram Avatar */
state.avatarImage.src = 'assets/game/haram_avatar.png';
for (let i = 1; i <= 15; i++) {
  const img = new Image();
  img.src = `assets/game/room_${i}.png`;
  state.bgImages[i] = img;
}

/* Input Handling */
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) state.keys.up = true;
  if (['ArrowDown', 'KeyS'].includes(e.code)) state.keys.down = true;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) state.keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) state.keys.right = true;
  if (['KeyE', 'Space', 'KeyA'].includes(e.code)) triggerAction();
});
window.addEventListener('keyup', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) state.keys.up = false;
  if (['ArrowDown', 'KeyS'].includes(e.code)) state.keys.down = false;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) state.keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) state.keys.right = false;
});

function bindCross(id, prop) {
  const btn = el(id); if (!btn) return;
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys[prop] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); state.keys[prop] = false; });
  btn.addEventListener('mousedown', () => state.keys[prop] = true);
  btn.addEventListener('mouseup', () => state.keys[prop] = false);
}
bindCross('btnUp','up'); bindCross('btnDown','down'); bindCross('btnLeft','left'); bindCross('btnRight','right');
el('btnA').addEventListener('click', triggerAction);

/* Main Loop */
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

function update() {
  if (el('quizModal').classList.contains('open')) return;

  const speed = 2.5;
  let dx = 0, dy = 0;

  const prevX = state.player.x, prevY = state.player.y;

  if (state.keys.up) { dy -= speed; state.player.facing = 'up'; }
  if (state.keys.down) { dy += speed; state.player.facing = 'down'; }
  if (state.keys.left) { dx -= speed; state.player.facing = 'left'; }
  if (state.keys.right) { dx += speed; state.player.facing = 'right'; }

  if (dx !== 0 || dy !== 0) {
    state.player.x = Math.max(20, Math.min(300, state.player.x + dx));
    state.player.y = Math.max(90, Math.min(260, state.player.y + dy));

    const fDist = Math.hypot(state.player.x - state.follower.x, state.player.y - state.follower.y);
    if (fDist > 18) {
      state.follower.x += (prevX - state.follower.x) * 0.25;
      state.follower.y += (prevY - state.follower.y) * 0.25;
    }
  }
}

function render() {
  const stage = STAGES[state.stageIdx];
  const roomNum = stage.num;

  /* 1. Draw Pre-generated Room PNG Asset Background */
  if (state.bgImages[roomNum] && state.bgImages[roomNum].complete && state.bgImages[roomNum].naturalWidth > 0) {
    ctx.drawImage(state.bgImages[roomNum], 0, 0, canvas.width, canvas.height);
  } else {
    drawGbcTilemap(stage.theme);
  }

  /* 2. Props & Door Marker */
  let nearbyTarget = null;

  stage.props.forEach(p => {
    ctx.fillStyle = (p.type === 'door' && state.hasKey) ? 'rgba(74, 222, 128, 0.4)' : 'rgba(37, 99, 235, 0.4)';
    ctx.beginPath(); ctx.arc(p.x, p.y + 4, 14, 0, Math.PI * 2); ctx.fill();

    ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.emoji, p.x, p.y + 6);

    ctx.fillStyle = '#1e293b'; ctx.font = 'bold 9px DungGeunMo';
    ctx.fillText(p.name, p.x, p.y + 20);

    const dist = Math.hypot(state.player.x - p.x, state.player.y - p.y);
    if (dist < 32) nearbyTarget = p;
  });

  /* 3. Render NPC if present */
  if (stage.npc) {
    const npc = stage.npc;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(npc.x, npc.y+6, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = npc.color || '#dc2626'; ctx.fillRect(npc.x-8, npc.y-14, 16, 18);
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(npc.x, npc.y-16, 7, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#1e293b'; ctx.font = 'bold 9px DungGeunMo'; ctx.textAlign = 'center';
    ctx.fillText(npc.name, npc.x, npc.y + 16);

    const dist = Math.hypot(state.player.x - npc.x, state.player.y - npc.y);
    if (dist < 32) nearbyTarget = { ...npc, type: 'npc', emoji: '💬' };
  }

  /* 4. Render Pikachu Companion Behind Haram */
  drawPixelPikachu(state.follower.x, state.follower.y);

  /* 5. Render Haram Avatar Sprite */
  if (state.avatarImage.complete && state.avatarImage.naturalWidth > 0) {
    ctx.drawImage(state.avatarImage, state.player.x - 14, state.player.y - 18, 28, 28);
  } else {
    drawGbcRedSprite(state.player.x, state.player.y, state.player.facing);
  }

  /* 6. Dialogue Window Text Update */
  if (nearbyTarget) {
    ctx.fillStyle = '#facc15'; ctx.fillRect(state.player.x - 30, state.player.y - 38, 60, 16);
    ctx.fillStyle = '#111'; ctx.font = 'bold 9px DungGeunMo'; ctx.textAlign = 'center';
    ctx.fillText('💬 [A] 조사', state.player.x, state.player.y - 26);

    if (nearbyTarget.type === 'door') {
      el('pokeSpeaker').textContent = '🚪 출구 문';
      el('pokeText').textContent = state.hasKey ? '🔑 [열쇠]를 사용해 문을 열었다! A버튼을 눌러 다음 챕터로 진행하자!' : '🔒 문이 굳게 잠겨 있다... (방 안의 가구나 NPC를 조사해 열쇠를 구하자!)';
    } else if (nearbyTarget.type === 'npc') {
      el('pokeSpeaker').textContent = `🗣️ ${nearbyTarget.name}`;
      el('pokeText').textContent = `${nearbyTarget.name}님에게 다가갔다. A버튼을 눌러 대화를 나누고 열쇠 퀴즈를 풀자!`;
    } else {
      el('pokeSpeaker').textContent = `🔍 ${nearbyTarget.name}`;
      el('pokeText').textContent = nearbyTarget.hint || `${nearbyTarget.name}을(를) 조사해 열쇠 퀴즈를 풀자!`;
    }
  }
}

/* Fallback Pokémon Yellow GBC Tilemap Drawing */
function drawGbcTilemap(theme) {
  const ts = 16;
  const cols = Math.ceil(canvas.width / ts);
  const rows = Math.ceil(canvas.height / ts);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * ts, y = r * ts;
      const alt = (c + r) % 2 === 0;

      if (theme === 'outdoor') {
        ctx.fillStyle = alt ? '#fff1f2' : '#ffe4e6'; ctx.fillRect(x, y, ts, ts);
        ctx.fillStyle = '#fb7185'; ctx.fillRect(x + 4, y + 4, 2, 2);
      } else if (theme === 'classroom') {
        ctx.fillStyle = alt ? '#e0f2fe' : '#bae6fd'; ctx.fillRect(x, y, ts, ts);
      } else if (theme === 'bank' || theme === 'office') {
        ctx.fillStyle = alt ? '#e2e8f0' : '#cbd5e1'; ctx.fillRect(x, y, ts, ts);
      } else {
        ctx.fillStyle = alt ? '#fde68a' : '#fef08a'; ctx.fillRect(x, y, ts, ts);
      }
    }
  }
}

function drawPixelPikachu(x, y) {
  ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.fillRect(x - 6, y - 8, 3, 5); ctx.fillRect(x + 3, y - 8, 3, 5);
  ctx.fillStyle = '#dc2626'; ctx.fillRect(x - 5, y, 2, 2); ctx.fillRect(x + 3, y, 2, 2);
}

function drawGbcRedSprite(x, y, facing) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(x, y + 6, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#dc2626'; ctx.fillRect(x - 6, y - 6, 12, 12);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 5, y + 6, 10, 5);
  ctx.fillStyle = '#fed7aa'; ctx.fillRect(x - 5, y - 16, 10, 10);
  ctx.fillStyle = '#dc2626'; ctx.fillRect(x - 7, y - 20, 14, 6);
}

function triggerAction() {
  const stage = STAGES[state.stageIdx];
  const nearbyProp = stage.props.find(p => Math.hypot(state.player.x - p.x, state.player.y - p.y) < 36);
  const nearbyNpc = stage.npc && Math.hypot(state.player.x - stage.npc.x, state.player.y - stage.npc.y) < 36;

  if (nearbyProp && nearbyProp.type === 'door') {
    if (state.hasKey) {
      state.hasKey = false;
      updateHud();
      if (state.stageIdx + 1 < STAGES.length) {
        state.stageIdx++;
        state.player.x = 50; state.player.y = 140; state.follower.x = 30; state.follower.y = 140;
        updateHud();
        setDialogue('🎉 탈출 성공!', `🔑 열쇠로 문을 열고 ${STAGES[state.stageIdx].num}번 방으로 들어왔다!`);
      } else {
        showWin();
      }
    } else {
      setDialogue('🔒 문이 잠김', '출구가 굳게 잠겨 있다... (방 안의 서류/가구 또는 NPC를 조사해 열쇠를 구하자!)');
    }
  } else if (nearbyProp) {
    openQuizModal(stage, nearbyProp);
  } else if (nearbyNpc) {
    openQuizModal(stage, { name: stage.npc.name, emoji: '💬' });
  }
}

function setDialogue(speaker, msg) {
  el('pokeSpeaker').textContent = speaker;
  el('pokeText').textContent = msg;
}

function openQuizModal(stage, target) {
  el('modalTitle').textContent = `🔑 ${target.name} - 열쇠 획득 퀴즈`;
  el('modalSub').textContent = stage.scene;
  el('modalQ').innerHTML = stage.q;
  el('modalFeedback').textContent = '';
  el('modalHint').classList.add('hidden');

  const content = el('modalContent'); content.innerHTML = '';

  if (stage.type === 'input') {
    const row = document.createElement('div'); row.className = 'input-row';
    row.innerHTML = `
      <input type="text" id="qInput" class="quiz-input" placeholder="정답 입력" autofocus>
      <button class="btn-submit" id="qSubmit">확인</button>
    `;
    content.appendChild(row);
    setTimeout(() => { const inp = el('qInput'); if (inp) inp.focus(); }, 100);
    el('qSubmit').onclick = checkAnswer;
    el('qInput').onkeydown = (e) => { if (e.key === 'Enter') checkAnswer(); };
  } else if (stage.type === 'choice') {
    const choiceList = document.createElement('div'); choiceList.className = 'choice-list';
    stage.choices.forEach((c, idx) => {
      const btn = document.createElement('button'); btn.className = 'choice-btn';
      btn.innerHTML = `<span>${idx + 1}.</span> <span>${c}</span>`;
      btn.onclick = () => checkChoice(idx);
      choiceList.appendChild(btn);
    });
    content.appendChild(choiceList);
  }

  el('quizModal').classList.add('open');
}

function checkAnswer() {
  const stage = STAGES[state.stageIdx];
  const val = (el('qInput').value || '').trim().toLowerCase();
  if (stage.accept.some(a => a.toLowerCase() === val)) {
    onQuizSuccess();
  } else {
    onQuizWrong('정답이 아닙니다. 다시 시도해 보세요!');
  }
}

function checkChoice(idx) {
  const stage = STAGES[state.stageIdx];
  if (idx === stage.answer) {
    onQuizSuccess();
  } else {
    onQuizWrong('오답입니다. 힌트를 참고하세요!');
  }
}

function onQuizSuccess() {
  state.hasKey = true;
  updateHud();
  el('modalFeedback').className = 'feedback-msg ok';
  el('modalFeedback').textContent = '🎉 정답입니다! 🔑 [ROOM 열쇠]를 획득했습니다. 출구 문으로 가세요!';
  setDialogue('🔑 열쇠 획득!', '열쇠를 가방에 넣었습니다! 오른쪽 출구 문(🚪)으로 가서 문을 열고 탈출하세요!');
  setTimeout(() => {
    el('quizModal').classList.remove('open');
  }, 1200);
}

function onQuizWrong(msg) {
  el('modalFeedback').className = 'feedback-msg no';
  el('modalFeedback').textContent = `❌ ${msg}`;
  const stage = STAGES[state.stageIdx];
  el('modalHint').textContent = `💡 힌트: ${stage.hints.join(' ')}`;
  el('modalHint').classList.remove('hidden');
}

el('modalClose').onclick = () => el('quizModal').classList.remove('open');

function updateHud() {
  const stage = STAGES[state.stageIdx];
  el('hudStageNum').textContent = String(stage.num).padStart(2, '0');
  el('hudStageTitle').textContent = stage.name;
  
  const keyBadge = el('hudKeyBadge');
  if (state.hasKey) {
    keyBadge.textContent = '🔑 열쇠 보유중';
    keyBadge.className = 'key-badge has-key';
  } else {
    keyBadge.textContent = '🔒 열쇠 미보유';
    keyBadge.className = 'key-badge';
  }
}

function showWin() {
  el('winPanel').classList.remove('hidden');
}

el('btnRestart').onclick = () => {
  state.stageIdx = 0; state.hasKey = false; state.player.x = 50; state.player.y = 140; state.follower.x = 30; state.follower.y = 140;
  el('winPanel').classList.add('hidden');
  updateHud();
};

updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
