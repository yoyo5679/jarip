<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>자립 방탈출 2D (포켓몬 RPG) - 하람이의 자립 여정 | 자립해봄</title>
<meta name="description" content="포켓몬스터 스타일 2D 픽셀 RPG로 즐기는 자립준비청년 방탈출 게임. 15개 챕터의 가구와 NPC를 탐험해 열쇠를 찾고 자립의 문을 열어보세요.">
<meta name="theme-color" content="#0e1626">
<meta property="og:title" content="자립 방탈출 2D (포켓몬 RPG) - 하람이의 자립 여정">
<meta property="og:description" content="포켓몬스터 스타일 2D 도트 하람이를 움직여 15개 방의 열쇠를 찾고 탈출하세요!">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&family=Noto+Sans+KR:wght@500;700;800&display=swap');

:root{
  --bg-main:#0c1220;
  --panel-bg:#162035;
  --panel-border:#2e4066;
  --txt:#f0f5ff;
  --txt-dim:#a0b2d6;
  --accent:#ffcc00;
  --accent-blue:#468cff;
  --accent-green:#34d399;
  --danger:#ef4444;
  --poke-red:#e11d48;
  --font-game:'DungGeunMo', 'Press Start 2P', monospace, sans-serif;
  --font-body:'Noto Sans KR', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background-color:var(--bg-main);color:var(--txt);font-family:var(--font-body);overflow-x:hidden}

.wrap{max-width:900px;margin:0 auto;padding:12px;display:flex;flex-direction:column;min-height:100dvh}

/* ===== Header ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel-bg);border:2px solid var(--panel-border);border-radius:14px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-game);font-size:1.1rem;color:var(--accent)}
.brand span{color:#fff;font-size:0.9rem}
.tb-actions{display:flex;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:10px;border:2px solid var(--panel-border);background:#0f172a;color:#fff;display:grid;place-items:center;text-decoration:none;cursor:pointer}

/* ===== Game Boy Console Screen ===== */
.console-frame{
  position:relative;background:#1a2336;border:4px solid #334155;border-radius:24px;
  padding:16px;box-shadow:0 20px 50px rgba(0,0,0,0.8);display:flex;flex-direction:column;gap:12px;
}
.hud-bar{display:flex;align-items:center;justify-content:space-between;background:#0f172a;padding:8px 14px;border-radius:12px;border:2px solid #2e4066}
.stage-badge{font-family:var(--font-game);color:var(--accent);font-size:1rem;display:flex;align-items:center;gap:8px}
.stage-title{font-size:0.95rem;font-weight:700;color:#fff}
.key-status{padding:4px 10px;border-radius:8px;font-size:0.8rem;font-weight:800;background:#334155;color:#94a3b8}
.key-status.has-key{background:rgba(52,211,153,0.25);color:var(--accent-green);border:1px solid var(--accent-green);animation:pulseKey 1.5s infinite}
@keyframes pulseKey{50%{transform:scale(1.05)}}

/* ===== Canvas Viewport ===== */
.viewport-wrap{position:relative;width:100%;aspect-ratio:16/10;max-height:500px;background:#000;border-radius:14px;overflow:hidden;border:3px solid #475569}
canvas#rpgCanvas{width:100%;height:100%;display:block;image-rendering:pixelated}

/* ===== Pokemon Dialogue Window ===== */
.poke-dialogue{
  background:#fff;color:#111;border:4px solid #1e293b;border-radius:12px;
  padding:14px 18px;min-height:90px;font-family:var(--font-game);font-size:1.05rem;line-height:1.6;
  position:relative;box-shadow:inset 0 0 0 2px #e2e8f0;display:flex;flex-direction:column;justify-content:space-between;
}
.poke-dialogue .speaker{color:var(--poke-red);font-weight:800;font-size:0.9rem;margin-bottom:4px}
.poke-dialogue .arrow-next{align-self:flex-end;color:var(--poke-red);font-size:1.2rem;animation:bounceArrow .6s infinite alternate}
@keyframes bounceArrow{from{transform:translateY(0)}to{transform:translateY(4px)}}

/* ===== Mobile D-Pad Controls ===== */
.controls-pad{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:12px 20px;border-radius:16px;border:2px solid #2e4066;margin-top:4px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px}
.btn-d{width:46px;height:46px;background:#334155;border:2px solid #475569;border-radius:10px;color:#fff;font-family:var(--font-game);font-size:1.1rem;display:grid;place-items:center;user-select:none;touch-action:manipulation;cursor:pointer}
.btn-d:active{background:var(--accent-blue);transform:scale(0.95)}
.btn-d.blank{visibility:hidden;border:none;background:none}

.btn-a{
  width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--poke-red),#991b1b);
  border:4px solid #fecdd3;color:#fff;font-family:var(--font-game);font-size:1.2rem;
  box-shadow:0 8px 0 #881337;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;
}
.btn-a:active{transform:translateY(4px);box-shadow:0 4px 0 #881337}

/* ===== Interactive Modal (Policy Quiz) ===== */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.25s ease}
.modal-mask.open{opacity:1;pointer-events:all}
.modal-box{width:100%;max-width:580px;background:#1e293b;border:3px solid var(--accent);border-radius:20px;padding:24px;box-shadow:0 25px 60px rgba(0,0,0,0.9);position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid #475569;background:#0f172a;color:#fff;cursor:pointer}
.modal-title{font-family:var(--font-game);color:var(--accent);font-size:1.1rem;margin-bottom:8px}
.modal-subtitle{font-size:0.9rem;color:var(--txt-dim);margin-bottom:16px;line-height:1.6}

.quiz-q{font-size:1.05rem;font-weight:700;margin-bottom:16px;line-height:1.6}
.quiz-q .hi{color:var(--accent)}

.input-row{display:flex;gap:10px;margin-bottom:14px}
.quiz-input{flex:1;padding:12px 16px;border-radius:12px;border:2px solid #475569;background:#0f172a;color:#fff;font-size:1.05rem;outline:none;font-family:var(--font-body)}
.btn-submit{padding:12px 24px;border:none;border-radius:12px;background:var(--accent);color:#111;font-weight:800;font-size:1rem;cursor:pointer}

.choice-list{display:grid;gap:10px}
.choice-btn{padding:14px 16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#fff;text-align:left;font-size:0.98rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px}
.choice-btn:hover{border-color:var(--accent);background:#1e293b}

.feedback-msg{margin-top:14px;font-size:0.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
.feedback-msg.ok{color:var(--accent-green)}
.feedback-msg.no{color:var(--danger)}
.hint-text{margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(255,204,0,0.1);border:1px dashed var(--accent);font-size:0.88rem;color:var(--accent)}

/* ===== Win Screen ===== */
.win-panel{padding:30px;text-align:center;background:#1e293b;border:4px solid var(--accent);border-radius:24px;margin-top:20px}
.win-title{font-family:var(--font-game);color:var(--accent);font-size:1.6rem;margin-bottom:12px}
.win-desc{color:var(--txt-dim);line-height:1.7;margin-bottom:20px}
.btn-restart{padding:14px 30px;border-radius:14px;border:none;background:var(--accent);color:#111;font-family:var(--font-game);font-size:1.1rem;cursor:pointer}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">🎮 자립 방탈출 2D <span>(포켓몬스터 RPG)</span></div>
    <div class="tb-actions">
      <a class="btn-icon" href="/" title="대시보드로">🏠</a>
    </div>
  </header>

  <!-- Console Frame -->
  <div class="console-frame">
    <!-- HUD Bar -->
    <div class="hud-bar">
      <div class="stage-badge">ROOM <span id="hudStageNum">01</span> / 15</div>
      <div class="stage-title" id="hudStageTitle">열여덟, 새 출발</div>
      <div class="key-status" id="hudKeyStatus">🔒 열쇠 미보유</div>
    </div>

    <!-- RPG Canvas Viewport -->
    <div class="viewport-wrap">
      <canvas id="rpgCanvas" width="800" height="500"></canvas>
    </div>

    <!-- Pokemon Dialogue Window -->
    <div class="poke-dialogue" id="pokeDialogue">
      <div class="speaker" id="pokeSpeaker">💡 하람이의 자립 여정</div>
      <div class="text" id="pokeText">방향키(↑↓←→)로 하람이를 움직여 가구/NPC를 조사하세요! [E]키 또는 A버튼으로 조사합니다.</div>
      <div class="arrow-next">▼</div>
    </div>

    <!-- Mobile Controls Pad -->
    <div class="controls-pad">
      <div class="dpad">
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnUp">▲</button>
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnLeft">◀</button>
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnRight">▶</button>
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnDown">▼</button>
        <button class="btn-d blank"></button>
      </div>
      <button class="btn-a" id="btnA">A/E</button>
    </div>
  </div>

  <!-- Win Panel -->
  <div id="winPanel" class="win-panel hidden">
    <div class="win-title">🎉 15개 챕터 완벽 탈출!</div>
    <p class="win-desc">하람이는 15개 방을 모두 탐험하며 수많은 지지와 실제 자립 지원 정책들을 발견했습니다.<br>당당한 자립의 문을 연 하람이의 새 출발을 응원해 주세요!</p>
    <button class="btn-restart" id="btnRestart">🔄 처음부터 다시하기</button>
  </div>
</div>

<!-- Interactive Quiz Modal -->
<div class="modal-mask" id="quizModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle">🔑 열쇠 획득 퀴즈</div>
    <div class="modal-subtitle" id="modalSub"></div>
    <div class="quiz-q" id="modalQ"></div>
    <div id="modalContent"></div>
    <div class="feedback-msg" id="modalFeedback"></div>
    <div class="hint-text hidden" id="modalHint"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- STAGES Data (15 Story Rooms) ---------- */
const STAGES = [
  {
    num:1, name:"열여덟, 새 출발", kicker:"CHAPTER 01 · 그룹홈 나의 방",
    scene:"열여덟 번째 생일 아침, 그룹홈 책상 위엔 '보호종료' 서류가 놓여 있다. 원장님은 '나간다고 우리 사이가 끝나는 게 아니야'라며 따뜻하게 안심시켜 주셨다.",
    q:"2021년, '보호종료아동'을 대신해 스스로 설 것을 준비한다는 의미로 바뀐 <span class='hi'>여섯 글자</span> 단어는?",
    accept:["자립준비청년","자립준비 청년"], type:"input", hints:["'자립'으로 시작하는 여섯 글자."],
    props:[
      { id:'desk', name:'서류 책상', x:200, y:220, type:'clue', emoji:'📄', hint:'책상 위 서류를 확인해 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:2, name:"떠남과 머묾 사이", kicker:"CHAPTER 02 · 그룹홈 거실",
    scene:"짐을 싸야 하나 고민할 때 원장님이 말씀하신다. '꼭 지금 나가지 않아도 돼. 네가 원하면 만 몇 세까지 보호를 연장할 수 있는 제도가 있단다.'",
    q:"본인이 원하면 <span class='hi'>만 몇 세까지 보호를 연장</span>할 수 있을까? (숫자만)",
    accept:["24","24세","만24세"], type:"input", hints:["만 24세까지 연장할 수 있어."],
    props:[
      { id:'calendar', name:'보호연장 달력', x:260, y:200, type:'clue', emoji:'🗓️', hint:'달력에 표기된 수치를 조사해 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:3, name:"살아가는 법을 배우는 곳", kicker:"CHAPTER 03 · 서울시 배움마켓",
    scene:"'나가면 뭐부터 하지?' 통장 만들기, 월세 계약... 담당 선생님이 서울시가 만든 전국 최초의 자립역량 교육을 소개해 준다.",
    q:"서울시 자립역량 교육의 이름은? (‘<span class='hi'>○○마켓</span>’ — 빈칸 두 글자)",
    accept:["배움","배움마켓","배움 마켓"], type:"input", hints:["'배움' + '마켓'."],
    props:[
      { id:'board', name:'강의 칠판', x:320, y:190, type:'clue', emoji:'🏫', hint:'칠판에 적힌 교육명을 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:4, name:"첫 자립의 종잣돈", kicker:"CHAPTER 04 · 주민센터 자립정착금",
    scene:"배움마켓 수료 후 주민센터에서 서울시가 첫 자립을 위해 지원하는 전국 최고 수준의 목돈(자립정착금)을 신청한다.",
    q:"서울시 <span class='hi'>자립정착금은 ○○○○만원</span> (2026년 기준). 숫자만 입력해줘.",
    accept:["2000","2000만원","이천만원","2천만원"], type:"input", hints:["2,000만원이야."],
    props:[
      { id:'grantDoc', name:'정착금 신청서', x:250, y:230, type:'clue', emoji:'📜', hint:'신청 서류 금액을 확인해 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:5, name:"스무날의 안심", kicker:"CHAPTER 05 · 은행 자립수당 창구",
    scene:"매월 20일 계좌로 지급되는 자립수당. 서울시는 대중교통비까지 매월 6만원씩 5년간 얹어주어 생활에 큰 힘이 된다.",
    q:"2026년 기준 <span class='hi'>자립수당은 월 ○○만원</span>? 숫자만 입력해줘.",
    accept:["50","50만원","오십만원"], type:"input", hints:["월 50만원 (매월 20일)."],
    props:[
      { id:'passbook', name:'수당 통장', x:340, y:210, type:'clue', emoji:'💳', hint:'통장 입금 내역을 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:6, name:"나도 모르던 손길", kicker:"CHAPTER 06 · 디딤씨앗통장",
    scene:"시설 시절부터 매달 저축해 온 디딤씨앗통장. 내가 저축한 금액에 정부가 1:2 비율로 매칭 적립을 더해 주었다.",
    q:"내가 <span class='hi'>매달 5만원을 저축</span>하면 정부 1:2 매칭이 더해져 매달 얼마가 쌓일까?",
    choices:["5만원","10만원","15만원","0원"], answer:2, type:"choice", hints:["내 5만 + 정부 10만 = 월 15만원."],
    props:[
      { id:'bankPig', name:'디딤씨앗 저금통', x:280, y:220, type:'clue', emoji:'🐷', hint:'매칭 저금통을 조사해 보자.' },

    ]
  },
  {
    num:7, name:"첫 밤의 다짐", kicker:"CHAPTER 07 · LH 전세임대 첫 자취방",
    scene:"LH 전세임대주택으로 계약한 나의 첫 보금자리. 전세금 대부분은 LH가 지원해주어 내가 낼 임대보증금은 매우 적다.",
    q:"LH 자립준비청년 전세임대주택의 <span class='hi'>임대보증금은 단 ○○○만원</span>? (숫자만)",
    accept:["100","100만원","백만원"], type:"input", hints:["임대보증금 단 100만원."],
    props:[
      { id:'contract', name:'임대차 계약서', x:300, y:200, type:'clue', emoji:'📑', hint:'보증금 서류를 조사해 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:8, name:"다시 찾아온 온기", kicker:"CHAPTER 08 · 원장님의 반찬 방문",
    scene:"독립 후 저녁, 원장님이 반찬통을 들고 오셨다. 서울시 지원센터에서 1:1로 퇴소 전후를 챙겨주는 사업이 있다.",
    q:"청년 한 사람을 <span class='hi'>1:1로 꾸준히 전담 지원하는</span> 서울시 센터의 사업 이름은?",
    choices:["집중사례관리","일회성 후원","연락 끊김","지원 없음"], answer:0, type:"choice", hints:["집중사례관리 사업."],
    props:[
      { id:'banchan', name:'정성 반찬통', x:260, y:240, type:'clue', emoji:'🍱', hint:'반찬통과 메모지를 보자.' },
      { id:'door', name:'출구 문', x:710, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:9, name:"혼자 견디지 마", kicker:"CHAPTER 09 · 정서·심리 상담실",

    props:[

    accept:["17","17개"], type:"input", hints:["전국 17개 전담기관."],

    ]

  },

    choices:[
      "보호받음 → 보호종료 결정 → 배움·정착금 준비 → 내 집 마련 → 홀로서기",
      "홀로서기 → 정착금 준비 → 보호받음 → 내 집 마련",
      "내 집 마련 → 보호받음 → 홀로서기",
      "순서 상관없음"
    ], answer:0, type:"choice", hints:["보호받음이 시작, 홀로서기가 완성."],

    ]
  },
  {

    scene:"첫 집들이 날, 원장님과 동료들이 축하해 준다. 수많은 손길을 딛고 서는 이 아름다운 여정의 이름.",
    q:"혼자가 아니라 많은 손을 딛고 스스로 서는 여정의 이름 <span class='hi'>두 글자</span>를 입력해줘.",
    accept:["자립","自立"], type:"input", hints:["정답은 '자립'."],
    props:[
      { id:'partyBox', name:'집들이 선물 상자', x:350, y:230, type:'clue', emoji:'🎁', hint:'선물 상자를 조사해 보자.' },
      { id:'door', name:'최종 탈출 문', x:710, y:220, type:'door', emoji:'🚪' }

  }
];

/* ---------- Game Engine State ---------- */
const state = {
  stageIdx: 0,
  hasKey: false,
  player: { x: 100, y: 240, facing: 'down', animFrame: 0 },
  keys: { up: false, down: false, left: false, right: false },
  bgImages: {},
  avatarImage: new Image()
};

const el = (id) => document.getElementById(id);
const canvas = el('rpgCanvas');
const ctx = canvas.getContext('2d');

state.avatarImage.src = 'assets/game/haram_avatar.png';

/* Load background images */
[1, 2, 3, 5, 7, 11, 15].forEach(n => {
  const img = new Image(); img.src = `assets/game/room_${n}.png`;
  state.bgImages[n] = img;
});

/* Input Handling */
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) state.keys.up = true;
  if (['ArrowDown', 'KeyS'].includes(e.code)) state.keys.down = true;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) state.keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) state.keys.right = true;
  if (['KeyE', 'Space'].includes(e.code)) triggerAction();
});
window.addEventListener('keyup', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) state.keys.up = false;
  if (['ArrowDown', 'KeyS'].includes(e.code)) state.keys.down = false;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) state.keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) state.keys.right = false;
});

function bindD(id, prop) {
  const btn = el(id); if (!btn) return;
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys[prop] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); state.keys[prop] = false; });
  btn.addEventListener('mousedown', () => state.keys[prop] = true);
  btn.addEventListener('mouseup', () => state.keys[prop] = false);
}
bindD('btnUp','up'); bindD('btnDown','down'); bindD('btnLeft','left'); bindD('btnRight','right');
el('btnA').addEventListener('click', triggerAction);

/* Main Loop */
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

function update() {
  if (el('quizModal').classList.contains('open')) return;

  const speed = 4;
  let dx = 0, dy = 0;
  if (state.keys.up) { dy -= speed; state.player.facing = 'up'; }
  if (state.keys.down) { dy += speed; state.player.facing = 'down'; }
  if (state.keys.left) { dx -= speed; state.player.facing = 'left'; }
  if (state.keys.right) { dx += speed; state.player.facing = 'right'; }

  if (dx !== 0 || dy !== 0) {
    state.player.animFrame += 0.2;
    state.player.x = Math.max(30, Math.min(770, state.player.x + dx));
    state.player.y = Math.max(140, Math.min(460, state.player.y + dy));
  }
}

function render() {
  const stage = STAGES[state.stageIdx];
  const roomNum = stage.num;

  /* 1. Background */
  if (state.bgImages[roomNum] && state.bgImages[roomNum].complete) {
    ctx.drawImage(state.bgImages[roomNum], 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  } else {
    /* Pokémon 8-bit Tile Style Fallback */
    ctx.fillStyle = '#1e293b'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(20,20,canvas.width-40,canvas.height-40);
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
    for (let x=40; x<canvas.width-40; x+=40) { ctx.beginPath(); ctx.moveTo(x,20); ctx.lineTo(x,canvas.height-20); ctx.stroke(); }
    for (let y=40; y<canvas.height-20; y+=40) { ctx.beginPath(); ctx.moveTo(20,y); ctx.lineTo(canvas.width-20,y); ctx.stroke(); }
  }

  /* 2. Render Props & Door */
  let nearbyProp = null;
  stage.props.forEach(p => {
    /* Prop Marker */
    ctx.fillStyle = (p.type === 'door' && state.hasKey) ? 'rgba(52,211,153,0.3)' : 'rgba(70,140,255,0.3)';
    ctx.beginPath(); ctx.arc(p.x, p.y + 10, 26, 0, Math.PI * 2); ctx.fill();

    ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.emoji, p.x, p.y + 8);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px DungGeunMo, sans-serif';
    ctx.fillText(p.name, p.x, p.y + 36);

    const dist = Math.hypot(state.player.x - p.x, state.player.y - p.y);
    if (dist < 55) nearbyProp = p;
  });

  /* 3. Render Player Character (Haram) */
  if (state.avatarImage.complete && state.avatarImage.naturalWidth > 0) {
    ctx.drawImage(state.avatarImage, state.player.x - 22, state.player.y - 36, 44, 52);
  } else {
    /* 8-bit Haram Avatar Fallback */
    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(state.player.x, state.player.y - 12, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px DungGeunMo'; ctx.textAlign='center';
    ctx.fillText('하람', state.player.x, state.player.y - 8);
  }

  /* 4. Action Prompt Badge */
  if (nearbyProp) {
    ctx.fillStyle = '#ffcc00'; ctx.fillRect(state.player.x - 45, state.player.y - 62, 90, 24);
    ctx.fillStyle = '#111'; ctx.font = 'bold 12px DungGeunMo'; ctx.textAlign = 'center';
    ctx.fillText('💬 [E] 조사', state.player.x, state.player.y - 45);

    /* Update Dialogue Box Text */
    if (nearbyProp.type === 'door') {
      el('pokeSpeaker').textContent = '🚪 출구 문';
      el('pokeText').textContent = state.hasKey ? '🔑 열쇠를 사용해 문을 열 수 있다! (E키/A버튼을 눌러 탈출)' : '🔒 문이 굳게 잠겨 있다... (방 안의 가구를 조사해 열쇠를 찾자!)';
    } else {
      el('pokeSpeaker').textContent = `🔍 ${nearbyProp.name}`;
      el('pokeText').textContent = nearbyProp.hint || `${nearbyProp.name}을(를) 조사해 열쇠 퀴즈를 풀자!`;
    }
  }
}

function triggerAction() {
  const stage = STAGES[state.stageIdx];
  const nearbyProp = stage.props.find(p => Math.hypot(state.player.x - p.x, state.player.y - p.y) < 60);
  if (!nearbyProp) return;

  if (nearbyProp.type === 'door') {
    if (state.hasKey) {
      /* Unlock & Advance to Next Stage! */
      state.hasKey = false;
      updateHud();
      if (state.stageIdx + 1 < STAGES.length) {
        state.stageIdx++;
        state.player.x = 100; state.player.y = 240;
        updateHud();
        setDialogue('🎉 성공!', `🔑 열쇠로 문을 열고 ${STAGES[state.stageIdx].num}번 방에 진입했다!`);
      } else {
        showWin();
      }
    } else {
      setDialogue('🔒 문이 잠김', '출구가 잠겨 있습니다. 방 안의 서류/가구를 조사해 퀴즈를 풀고 열쇠를 획득하세요!');
    }
  } else {
    /* Open Quiz Modal for Clue Prop */
    openQuizModal(stage, nearbyProp);
  }
}

function setDialogue(speaker, msg) {
  el('pokeSpeaker').textContent = speaker;
  el('pokeText').textContent = msg;
}

function openQuizModal(stage, prop) {
  el('modalTitle').textContent = `🔑 ${prop.name} - 열쇠 획득 퀴즈`;
  el('modalSub').textContent = stage.scene;
  el('modalQ').innerHTML = stage.q;
  el('modalFeedback').textContent = '';
  el('modalHint').classList.add('hidden');

  const content = el('modalContent'); content.innerHTML = '';

  if (stage.type === 'input') {
    const row = document.createElement('div'); row.className = 'input-row';
    row.innerHTML = `
      <input type="text" id="qInput" class="quiz-input" placeholder="정답 입력" autofocus>
      <button class="btn-submit" id="qSubmit">확인</button>
    `;
    content.appendChild(row);
    setTimeout(() => { const inp = el('qInput'); if (inp) inp.focus(); }, 100);
    el('qSubmit').onclick = checkAnswer;
    el('qInput').onkeydown = (e) => { if (e.key === 'Enter') checkAnswer(); };
  } else if (stage.type === 'choice') {
    const choiceList = document.createElement('div'); choiceList.className = 'choice-list';
    stage.choices.forEach((c, idx) => {
      const btn = document.createElement('button'); btn.className = 'choice-btn';
      btn.innerHTML = `<span>${idx + 1}.</span> <span>${c}</span>`;
      btn.onclick = () => checkChoice(idx);
      choiceList.appendChild(btn);
    });
    content.appendChild(choiceList);
  }

  el('quizModal').classList.add('open');
}

function checkAnswer() {
  const stage = STAGES[state.stageIdx];
  const val = (el('qInput').value || '').trim().toLowerCase();
  if (stage.accept.some(a => a.toLowerCase() === val)) {
    onQuizSuccess();
  } else {
    onQuizWrong('정답이 아닙니다. 다시 시도해 보세요!');
  }
}

function checkChoice(idx) {
  const stage = STAGES[state.stageIdx];
  if (idx === stage.answer) {
    onQuizSuccess();
  } else {
    onQuizWrong('오답입니다. 힌트를 참고하세요!');
  }
}

function onQuizSuccess() {
  state.hasKey = true;
  updateHud();
  el('modalFeedback').className = 'feedback-msg ok';
  el('modalFeedback').textContent = '🎉 정답입니다! 🔑 [ROOM 열쇠]를 획득했습니다. 출구 문으로 가세요!';
  setDialogue('🔑 열쇠 획득!', '열쇠를 획득했습니다! 오른쪽 출구 문(🚪)으로 이동해 문을 열어 탈출하세요!');
  setTimeout(() => {
    el('quizModal').classList.remove('open');
  }, 1200);
}

function onQuizWrong(msg) {
  el('modalFeedback').className = 'feedback-msg no';
  el('modalFeedback').textContent = `❌ ${msg}`;
  const stage = STAGES[state.stageIdx];
  el('modalHint').textContent = `💡 힌트: ${stage.hints.join(' ')}`;
  el('modalHint').classList.remove('hidden');
}

el('modalClose').onclick = () => el('quizModal').classList.remove('open');

function updateHud() {
  const stage = STAGES[state.stageIdx];
  el('hudStageNum').textContent = String(stage.num).padStart(2, '0');
  el('hudStageTitle').textContent = stage.name;
  
  const keyBadge = el('hudKeyStatus');
  if (state.hasKey) {
    keyBadge.textContent = '🔑 열쇠 보유중';
    keyBadge.className = 'key-status has-key';
  } else {
    keyBadge.textContent = '🔒 열쇠 미보유';
    keyBadge.className = 'key-status';
  }
}

function showWin() {
  el('winPanel').classList.remove('hidden');
}

el('btnRestart').onclick = () => {
  state.stageIdx = 0; state.hasKey = false; state.player.x = 100; state.player.y = 240;
  el('winPanel').classList.add('hidden');
  updateHud();
};

updateHud();
requestAnimationFrame(loop);
</script>
