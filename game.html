<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>자립 방탈출 2D - 하람이의 자립 여정 | 자립해봄</title>
<meta name="description" content="모던 애니메이션 2D 방탈출 RPG 게임. 하람이와 자립새싹 마스코트가 함께 15개 챕터의 방을 탐험하며 자립 정책 열쇠를 찾아 탈출합니다.">
<meta name="theme-color" content="#0b1329">
<meta property="og:title" content="자립 방탈출 2D - 하람이의 자립 여정">
<meta property="og:description" content="하람이와 자립새싹 마스코트의 15개 챕터 자립 방탈출 RPG!">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=DungGeunMo&family=Noto+Sans+KR:wght@500;700;800&display=swap');

:root{
  --bg-main:#070c18;
  --panel-bg:rgba(18, 28, 48, 0.82);
  --panel-border:rgba(140, 170, 255, 0.2);
  --txt:#eaf0ff;
  --txt-dim:#94a3b8;
  --accent:#ffcc00;
  --accent-blue:#3b82f6;
  --accent-green:#10b981;
  --danger:#ef4444;
  --brand-green:#34d399;
  --font-game:'DungGeunMo', monospace, sans-serif;
  --font-body:'Noto Sans KR', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background-color:var(--bg-main);color:var(--txt);font-family:var(--font-body);overflow-x:hidden}

.wrap{max-width:880px;margin:0 auto;padding:12px;display:flex;flex-direction:column;min-height:100dvh}

/* ===== Top Header ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:16px;margin-bottom:12px;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-game);font-size:1.15rem;color:var(--accent)}
.brand span{color:#fff;font-size:0.88rem}
.tb-actions{display:flex;gap:8px}
.btn-icon{padding:6px 14px;border-radius:10px;border:1px solid var(--panel-border);background:rgba(255,255,255,0.08);color:#fff;font-family:var(--font-game);font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;transition:.2s}
.btn-icon:hover{background:rgba(255,255,255,0.18)}

/* ===== Game Console Frame ===== */
.game-frame{
  position:relative;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:24px;
  padding:16px;box-shadow:0 25px 60px rgba(0,0,0,0.85);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:12px;
}
.hud-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.35);padding:10px 16px;border-radius:14px;border:1px solid var(--panel-border)}
.stage-badge{font-family:var(--font-game);color:var(--accent);font-size:1rem;display:flex;align-items:center;gap:8px}
.stage-title{font-size:0.95rem;font-weight:700;color:#fff}
.key-badge{padding:5px 14px;border-radius:10px;font-size:0.82rem;font-weight:800;background:rgba(255,255,255,0.08);color:#94a3b8;font-family:var(--font-game);border:1px solid var(--panel-border)}
.key-badge.has-key{background:rgba(16,185,129,0.2);color:var(--brand-green);border-color:var(--brand-green);animation:pulseKey 1.5s infinite}
@keyframes pulseKey{50%{transform:scale(1.05)}}

/* ===== Viewport Canvas ===== */
.viewport-wrap{position:relative;width:100%;aspect-ratio:16/10;max-height:480px;background:#050914;border-radius:16px;overflow:hidden;border:1px solid var(--panel-border);box-shadow:0 15px 35px rgba(0,0,0,0.6)}
canvas#gameCanvas{width:100%;height:100%;display:block;image-rendering:auto}

/* ===== Modern RPG Dialogue Window ===== */
.rpg-dialogue{
  background:rgba(10, 16, 30, 0.92);color:#fff;border:1px solid var(--panel-border);border-radius:14px;
  padding:14px 18px;min-height:92px;font-family:var(--font-game);font-size:1.05rem;line-height:1.6;
  position:relative;backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.rpg-dialogue .speaker{color:var(--accent);font-weight:800;font-size:0.9rem;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.rpg-dialogue .arrow-next{align-self:flex-end;color:var(--accent);font-size:1.1rem;animation:bounceArrow .6s infinite alternate}
@keyframes bounceArrow{from{transform:translateY(0)}to{transform:translateY(4px)}}

/* ===== Mobile Controls Pad ===== */
.controls-pad{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.3);padding:10px 18px;border-radius:18px;border:1px solid var(--panel-border)}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px}
.btn-d{width:46px;height:46px;background:rgba(255,255,255,0.08);border:1px solid var(--panel-border);border-radius:12px;color:#fff;font-family:var(--font-game);font-size:1.1rem;display:grid;place-items:center;user-select:none;touch-action:manipulation;cursor:pointer;transition:.15s}
.btn-d:active{background:rgba(91,140,255,0.3);transform:scale(0.95)}
.btn-d.blank{visibility:hidden;border:none;background:none}

.btn-a{
  padding:0 28px;height:72px;border-radius:20px;border:1px solid var(--brand-green);
  background:linear-gradient(135deg,rgba(52,211,153,0.3),rgba(59,130,246,0.3));color:#fff;
  font-family:var(--font-game);font-size:1.15rem;display:flex;align-items:center;gap:8px;
  cursor:pointer;touch-action:manipulation;box-shadow:0 10px 25px rgba(52,211,153,0.25);
}
.btn-a:active{transform:scale(0.96)}

/* ===== Quiz Modal ===== */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(5,9,20,0.85);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.25s ease}
.modal-mask.open{opacity:1;pointer-events:all}
.modal-box{width:100%;max-width:580px;background:#121a2c;border:1px solid var(--panel-border);border-radius:24px;padding:24px;box-shadow:0 30px 70px rgba(0,0,0,0.9);position:relative;max-height:90vh;overflow-y:auto;color:#fff}
.modal-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-border);background:rgba(255,255,255,0.08);color:#fff;cursor:pointer}
.modal-title{font-family:var(--font-game);color:var(--accent);font-size:1.15rem;margin-bottom:8px}
.modal-subtitle{font-size:0.92rem;color:var(--txt-dim);margin-bottom:16px;line-height:1.65}

.quiz-q{font-size:1.05rem;font-weight:700;margin-bottom:16px;line-height:1.6}
.quiz-q .hi{color:var(--accent)}

.input-row{display:flex;gap:10px;margin-bottom:14px}
.quiz-input{flex:1;padding:14px 18px;border-radius:14px;border:1px solid var(--panel-border);background:rgba(0,0,0,0.3);color:#fff;font-size:1.05rem;outline:none;font-family:var(--font-body)}
.btn-submit{padding:14px 26px;border:none;border-radius:14px;background:linear-gradient(120deg,var(--accent-blue),#6366f1);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}

.choice-list{display:grid;gap:10px}
.choice-btn{padding:14px 18px;border-radius:14px;border:1px solid var(--panel-border);background:rgba(0,0,0,0.2);color:#fff;text-align:left;font-size:0.98rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.18s}
.choice-btn:hover{border-color:var(--accent-blue);background:rgba(59,130,246,0.15)}

.feedback-msg{margin-top:14px;font-size:0.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
.feedback-msg.ok{color:var(--brand-green)}
.feedback-msg.no{color:var(--danger)}
.hint-text{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,204,0,0.1);border:1px dashed var(--accent);font-size:0.88rem;color:var(--accent)}

/* ===== Win Panel ===== */
.win-panel{padding:32px;text-align:center;background:#121a2c;border:1px solid var(--panel-border);border-radius:24px;margin-top:16px}
.win-title{font-family:var(--font-game);color:var(--accent);font-size:1.6rem;margin-bottom:12px}
.win-desc{color:var(--txt-dim);line-height:1.75;margin-bottom:20px;font-size:0.98rem}
.btn-restart{padding:16px 32px;border-radius:16px;border:none;background:linear-gradient(120deg,var(--accent-blue),#6366f1);color:#fff;font-family:var(--font-game);font-size:1.1rem;cursor:pointer}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">🌱 자립 방탈출 2D <span>(하람이의 자립 여정)</span></div>
    <div class="tb-actions">
      <a class="btn-icon" href="/">🏠 대시보드</a>
    </div>
  </header>

  <!-- Game Console Frame -->
  <div class="game-frame">
    <!-- HUD Bar -->
    <div class="hud-bar">
      <div class="stage-badge">ROOM <span id="hudStageNum">01</span> / 15</div>
      <div class="stage-title" id="hudStageTitle">그룹홈 나의 방</div>
      <div class="key-badge" id="hudKeyBadge">🔒 열쇠 미보유</div>
    </div>

    <!-- Viewport Canvas -->
    <div class="viewport-wrap">
      <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <!-- RPG Dialogue Window -->
    <div class="rpg-dialogue" id="rpgDialogue">
      <div class="speaker" id="rpgSpeaker">🌱 하람과 새싹이</div>
      <div class="text" id="rpgText">방향키(↑↓←→)로 하람이를 움직여 가구 및 NPC를 조사하세요! [E]키 또는 조사 버튼으로 탐험합니다.</div>
      <div class="arrow-next">▼</div>
    </div>

    <!-- Mobile Controls Pad -->
    <div class="controls-pad">
      <div class="dpad">
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnUp">▲</button>
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnLeft">◀</button>
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnRight">▶</button>
        <button class="btn-d blank"></button>
        <button class="btn-d" id="btnDown">▼</button>
        <button class="btn-d blank"></button>
      </div>
      <button class="btn-a" id="btnA">🔍 [E] 조사</button>
    </div>
  </div>

  <!-- Win Panel -->
  <div id="winPanel" class="win-panel hidden">
    <div class="win-title">🎉 15개 챕터 완벽 탈출 성공!</div>
    <p class="win-desc">하람이는 15개 방을 모두 탐험하며 수많은 지지와 실제 자립 지원 정책들을 발견했습니다.<br>당당한 자립의 문을 연 하람이의 새로운 첫발을 축하해 주세요!</p>
    <button class="btn-restart" id="btnRestart">🔄 처음부터 다시하기</button>
  </div>
</div>

<!-- Interactive Quiz Modal -->
<div class="modal-mask" id="quizModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle">🔑 열쇠 획득 퀴즈</div>
    <div class="modal-subtitle" id="modalSub"></div>
    <div class="quiz-q" id="modalQ"></div>
    <div id="modalContent"></div>
    <div class="feedback-msg" id="modalFeedback"></div>
    <div class="hint-text hidden" id="modalHint"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- STAGES Data (15 Original Story Rooms) ---------- */
const STAGES = [
  {
    num:1, name:"열여덟, 새 출발", kicker:"CHAPTER 01 · 그룹홈 나의 방",
    scene:"열여덟 번째 생일 아침, 그룹홈 책상 위엔 '보호종료' 서류가 놓여 있다. 원장님은 '나간다고 우리 사이가 끝나는 게 아니야'라며 따뜻하게 다독여 주셨다.",
    q:"2021년, '보호종료아동'을 대신해 스스로 설 것을 준비한다는 의미로 바뀐 <span class='hi'>여섯 글자</span> 단어는?",
    accept:["자립준비청년","자립준비 청년"], type:"input", hints:["'자립'으로 시작하는 여섯 글자."],
    npc: { name:'원장님', x:400, y:200, color:'#e11d48' },
    props:[
      { id:'desk', name:'서류 책상', x:200, y:220, type:'clue', emoji:'📄', hint:'책상 위 서류를 조사하자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:2, name:"떠남과 머묾 사이", kicker:"CHAPTER 02 · 그룹홈 거실",
    scene:"짐을 싸야 하나 고민할 때 원장님이 말씀하신다. '꼭 지금 나가지 않아도 돼. 네가 원하면 만 몇 세까지 보호를 연장할 수 있는 제도가 있단다.'",
    q:"본인이 원하면 <span class='hi'>만 몇 세까지 보호를 연장</span>할 수 있을까? (숫자만)",
    accept:["24","24세","만24세"], type:"input", hints:["만 24세까지 연장 가능."],
    npc: { name:'원장님', x:350, y:200, color:'#e11d48' },
    props:[
      { id:'calendar', name:'보호연장 달력', x:240, y:200, type:'clue', emoji:'🗓️', hint:'벽 달력의 나이를 조사하자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:3, name:"살아가는 법을 배우는 곳", kicker:"CHAPTER 03 · 서울시 배움마켓",
    scene:"'나가면 뭐부터 하지?' 통장 만들기, 월세 계약... 선생님이 서울시가 만든 전국 최초의 자립역량 교육을 소개해 준다.",
    q:"서울시 자립역량 교육의 이름은? (‘<span class='hi'>○○마켓</span>’ — 빈칸 두 글자)",
    accept:["배움","배움마켓","배움 마켓"], type:"input", hints:["'배움' + '마켓'."],
    npc: { name:'담당강사', x:400, y:180, color:'#2563eb' },
    props:[
      { id:'board', name:'강의 칠판', x:240, y:180, type:'clue', emoji:'🏫', hint:'칠판에 적힌 자립 교육명을 보자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:4, name:"첫 자립의 종잣돈", kicker:"CHAPTER 04 · 주민센터 자립정착금",
    scene:"주민센터 민원 창구에 도착했다. 서울시가 첫 출발을 위해 전국 최고 수준으로 지원하는 자립정착금(2,000만원) 서류가 놓여 있다.",
    q:"서울시 <span class='hi'>자립정착금은 ○○○○만원</span> (2026년 기준)? 숫자만 입력해줘.",
    accept:["2000","2000만원","이천만원","2천만원"], type:"input", hints:["2,000만원이야."],
    npc: { name:'주민센터 공무원', x:380, y:180, color:'#0284c7' },
    props:[
      { id:'grantDoc', name:'2천만원 정착금 확인서', x:240, y:230, type:'clue', emoji:'📜', hint:'민원 창구 정착금 서류를 보자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:5, name:"스무날의 안심", kicker:"CHAPTER 05 · 주민센터 복지 창구",

    q:"2026년 기준 <span class='hi'>자립수당은 월 ○○만원</span>? 숫자만 입력해줘.",
    accept:["50","50만원","오십만원"], type:"input", hints:["월 50만원 (매월 20일 지급)."],
    npc: { name:'복지 공무원', x:380, y:180, color:'#059669' },
    props:[
      { id:'passbook', name:'수당 신청서 & 교통카드', x:240, y:230, type:'clue', emoji:'💳', hint:'복지 창구 수당 서류를 보자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:6, name:"나도 모르던 손길", kicker:"CHAPTER 06 · 디딤씨앗통장 창구",

    q:"디딤씨앗통장에 내가 <span class='hi'>매달 5만원을 저축</span>하면 매달 얼마가 쌓일까?",
    choices:["5만원","10만원","15만원","0원"], answer:2, type:"choice", hints:["내 5만 + 정부 10만 = 월 15만원."],
    npc: { name:'은행원', x:400, y:180, color:'#4338ca' },
    props:[
      { id:'bankPig', name:'디딤씨앗 저금통', x:250, y:230, type:'clue', emoji:'🐷', hint:'매칭 저금통을 조사하자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:7, name:"첫 밤의 다짐", kicker:"CHAPTER 07 · LH 전세임대 첫 자취방",
    scene:"LH 전세임대주택으로 계약한 나의 첫 보금자리. 전세금 대부분은 LH가 대주어 임대보증금은 매우 적다.",
    q:"LH 자립준비청년 전세임대주택의 <span class='hi'>임대보증금은 단 ○○○만원</span>? (숫자만)",
    accept:["100","100만원","백만원"], type:"input", hints:["임대보증금 단 100만원."],
    props:[
      { id:'contract', name:'임대차 계약서', x:260, y:220, type:'clue', emoji:'📑', hint:'원룸 계약 서류를 조사하자.' },
      { id:'door', name:'출구 문', x:720, y:220, type:'door', emoji:'🚪' }
    ]
  },
  {
    num:8, name:"다시 찾아온 온기", kicker:"CHAPTER 08 · 원장님의 반찬 주방",

/* ---------- Game Engine State & Preloaded Assets ---------- */
const state = {
  stageIdx: 0,
  hasKey: false,
  player: { x: 100, y: 240, facing: 'down' },
  follower: { x: 70, y: 240 },
  keys: { up: false, down: false, left: false, right: false },
  bgImages: {},
  avatarImage: new Image()
};

const el = (id) => document.getElementById(id);
const canvas = el('gameCanvas');
const ctx = canvas.getContext('2d');

/* Preload Assets */
state.avatarImage.src = 'assets/game/haram_avatar.png';
for (let i = 1; i <= 15; i++) {
  const img = new Image();
  img.src = `assets/game/room_${i}.png`;
  state.bgImages[i] = img;
}

/* Input Handling */
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) state.keys.up = true;
  if (['ArrowDown', 'KeyS'].includes(e.code)) state.keys.down = true;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) state.keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) state.keys.right = true;
  if (['KeyE', 'Space'].includes(e.code)) triggerAction();
});
window.addEventListener('keyup', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) state.keys.up = false;
  if (['ArrowDown', 'KeyS'].includes(e.code)) state.keys.down = false;
  if (['ArrowLeft', 'KeyA'].includes(e.code)) state.keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) state.keys.right = false;
});

function bindCross(id, prop) {
  const btn = el(id); if (!btn) return;
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys[prop] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); state.keys[prop] = false; });
  btn.addEventListener('mousedown', () => state.keys[prop] = true);
  btn.addEventListener('mouseup', () => state.keys[prop] = false);
}
bindCross('btnUp','up'); bindCross('btnDown','down'); bindCross('btnLeft','left'); bindCross('btnRight','right');
el('btnA').addEventListener('click', triggerAction);

/* Main Loop */
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

function update() {
  if (el('quizModal').classList.contains('open')) return;

  const speed = 4;
  let dx = 0, dy = 0;
  const prevX = state.player.x, prevY = state.player.y;

  if (state.keys.up) { dy -= speed; state.player.facing = 'up'; }
  if (state.keys.down) { dy += speed; state.player.facing = 'down'; }
  if (state.keys.left) { dx -= speed; state.player.facing = 'left'; }
  if (state.keys.right) { dx += speed; state.player.facing = 'right'; }

  if (dx !== 0 || dy !== 0) {
    state.player.x = Math.max(35, Math.min(765, state.player.x + dx));
    state.player.y = Math.max(140, Math.min(445, state.player.y + dy));

    const fDist = Math.hypot(state.player.x - state.follower.x, state.player.y - state.follower.y);
    if (fDist > 30) {
      state.follower.x += (prevX - state.follower.x) * 0.25;
      state.follower.y += (prevY - state.follower.y) * 0.25;
    }
  }
}

function render() {
  const stage = STAGES[state.stageIdx];
  const roomNum = stage.num;

  /* 1. Background PNG Asset */
  if (state.bgImages[roomNum] && state.bgImages[roomNum].complete && state.bgImages[roomNum].naturalWidth > 0) {
    ctx.drawImage(state.bgImages[roomNum], 0, 0, canvas.width, canvas.height);
  } else {
    /* Glassmorphism Dark Fallback */
    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, '#0c1427'); grad.addColorStop(1, '#16223d');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  /* 2. Props & Door */
  let nearbyTarget = null;

  stage.props.forEach(p => {
    ctx.fillStyle = (p.type === 'door' && state.hasKey) ? 'rgba(52,211,153,0.35)' : 'rgba(59,130,246,0.35)';
    ctx.beginPath(); ctx.arc(p.x, p.y + 10, 24, 0, Math.PI * 2); ctx.fill();

    ctx.font = '26px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.emoji, p.x, p.y + 8);

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px DungGeunMo';
    ctx.fillText(p.name, p.x, p.y + 36);

    const dist = Math.hypot(state.player.x - p.x, state.player.y - p.y);
    if (dist < 55) nearbyTarget = p;
  });

  /* 3. Render NPC */
  if (stage.npc) {
    const npc = stage.npc;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(npc.x, npc.y+12, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = npc.color || '#e11d48'; ctx.fillRect(npc.x-14, npc.y-24, 28, 30);
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(npc.x, npc.y-28, 12, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px DungGeunMo'; ctx.textAlign = 'center';
    ctx.fillText(npc.name, npc.x, npc.y + 24);

    const dist = Math.hypot(state.player.x - npc.x, state.player.y - npc.y);
    if (dist < 55) nearbyTarget = { ...npc, type: 'npc', emoji: '💬' };
  }

  /* 4. Render Original Companion '새싹이' (Jaripon Sprout Mascot) */
  drawSproutCompanion(state.follower.x, state.follower.y);

  /* 5. Render Original Haram Avatar */
  if (state.avatarImage.complete && state.avatarImage.naturalWidth > 0) {
    ctx.drawImage(state.avatarImage, state.player.x - 20, state.player.y - 28, 40, 40);
  } else {
    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(state.player.x, state.player.y - 10, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px DungGeunMo'; ctx.textAlign = 'center'; ctx.fillText('하람', state.player.x, state.player.y - 6);
  }

  /* 6. Interaction Prompt Badge & Dialogue */
  if (nearbyTarget) {
    ctx.fillStyle = '#ffcc00'; ctx.fillRect(state.player.x - 45, state.player.y - 58, 90, 24);
    ctx.fillStyle = '#111'; ctx.font = 'bold 12px DungGeunMo'; ctx.textAlign = 'center';
    ctx.fillText('💬 [E] 조사', state.player.x, state.player.y - 42);

    if (nearbyTarget.type === 'door') {
      el('rpgSpeaker').textContent = '🚪 출구 문';
      el('rpgText').textContent = state.hasKey ? '🔑 [열쇠]를 얻었다! [E]키를 눌러 문을 열고 다음 챕터로 진행하자!' : '🔒 문이 굳게 잠겨 있다... (방 안의 가구나 NPC를 조사해 열쇠를 구하자!)';
    } else if (nearbyTarget.type === 'npc') {
      el('rpgSpeaker').textContent = `🗣️ ${nearbyTarget.name}`;
      el('rpgText').textContent = `${nearbyTarget.name}님에게 다가갔다. [E]키를 눌러 대화를 나누고 열쇠 퀴즈를 풀자!`;
    } else {
      el('rpgSpeaker').textContent = `🔍 ${nearbyTarget.name}`;
      el('rpgText').textContent = nearbyTarget.hint || `${nearbyTarget.name}을(를) 조사해 열쇠 퀴즈를 풀자!`;
    }
  }
}

/* Original Sprout Mascot '새싹이' Companion Drawing */
function drawSproutCompanion(x, y) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(x, y + 10, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#34d399'; ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(x - 3, y - 11, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4, y - 13, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111827'; ctx.fillRect(x - 5, y - 2, 2, 4); ctx.fillRect(x + 3, y - 2, 2, 4);
}

function triggerAction() {
  const stage = STAGES[state.stageIdx];
  const nearbyProp = stage.props.find(p => Math.hypot(state.player.x - p.x, state.player.y - p.y) < 60);
  const nearbyNpc = stage.npc && Math.hypot(state.player.x - stage.npc.x, state.player.y - stage.npc.y) < 60;

  if (nearbyProp && nearbyProp.type === 'door') {
    if (state.hasKey) {
      state.hasKey = false;
      updateHud();
      if (state.stageIdx + 1 < STAGES.length) {
        state.stageIdx++;
        state.player.x = 100; state.player.y = 240; state.follower.x = 70; state.follower.y = 240;
        updateHud();
        setDialogue('🎉 탈출 성공!', `🔑 열쇠로 문을 열고 ${STAGES[state.stageIdx].num}번 방으로 들어왔다!`);
      } else {
        showWin();
      }
    } else {
      setDialogue('🔒 문이 잠김', '출구가 굳게 잠겨 있습니다. 방 안의 서류/가구 또는 NPC를 조사해 퀴즈를 풀고 열쇠를 구하세요!');
    }
  } else if (nearbyProp) {
    openQuizModal(stage, nearbyProp);
  } else if (nearbyNpc) {
    openQuizModal(stage, { name: stage.npc.name, emoji: '💬' });
  }
}

function setDialogue(speaker, msg) {
  el('rpgSpeaker').textContent = speaker;
  el('rpgText').textContent = msg;
}

function openQuizModal(stage, target) {
  el('modalTitle').textContent = `🔑 ${target.name} - 열쇠 획득 퀴즈`;
  el('modalSub').textContent = stage.scene;
  el('modalQ').innerHTML = stage.q;
  el('modalFeedback').textContent = '';
  el('modalHint').classList.add('hidden');

  const content = el('modalContent'); content.innerHTML = '';

  if (stage.type === 'input') {
    const row = document.createElement('div'); row.className = 'input-row';
    row.innerHTML = `
      <input type="text" id="qInput" class="quiz-input" placeholder="정답 입력" autofocus>
      <button class="btn-submit" id="qSubmit">확인</button>
    `;
    content.appendChild(row);
    setTimeout(() => { const inp = el('qInput'); if (inp) inp.focus(); }, 100);
    el('qSubmit').onclick = checkAnswer;
    el('qInput').onkeydown = (e) => { if (e.key === 'Enter') checkAnswer(); };
  } else if (stage.type === 'choice') {
    const choiceList = document.createElement('div'); choiceList.className = 'choice-list';
    stage.choices.forEach((c, idx) => {
      const btn = document.createElement('button'); btn.className = 'choice-btn';
      btn.innerHTML = `<span>${idx + 1}.</span> <span>${c}</span>`;
      btn.onclick = () => checkChoice(idx);
      choiceList.appendChild(btn);
    });
    content.appendChild(choiceList);
  }

  el('quizModal').classList.add('open');
}

function checkAnswer() {
  const stage = STAGES[state.stageIdx];
  const val = (el('qInput').value || '').trim().toLowerCase();
  if (stage.accept.some(a => a.toLowerCase() === val)) {
    onQuizSuccess();
  } else {
    onQuizWrong('정답이 아닙니다. 다시 시도해 보세요!');
  }
}

function checkChoice(idx) {
  const stage = STAGES[state.stageIdx];
  if (idx === stage.answer) {
    onQuizSuccess();
  } else {
    onQuizWrong('오답입니다. 힌트를 참고하세요!');
  }
}

function onQuizSuccess() {
  state.hasKey = true;
  updateHud();
  el('modalFeedback').className = 'feedback-msg ok';
  el('modalFeedback').textContent = '🎉 정답입니다! 🔑 [ROOM 열쇠]를 획득했습니다. 출구 문으로 가세요!';
  setDialogue('🔑 열쇠 획득!', '열쇠를 획득했습니다! 오른쪽 출구 문(🚪)으로 이동해 문을 열고 탈출하세요!');
  setTimeout(() => {
    el('quizModal').classList.remove('open');
  }, 1200);
}

function onQuizWrong(msg) {
  el('modalFeedback').className = 'feedback-msg no';
  el('modalFeedback').textContent = `❌ ${msg}`;
  const stage = STAGES[state.stageIdx];
  el('modalHint').textContent = `💡 힌트: ${stage.hints.join(' ')}`;
  el('modalHint').classList.remove('hidden');
}

el('modalClose').onclick = () => el('quizModal').classList.remove('open');

function updateHud() {
  const stage = STAGES[state.stageIdx];
  el('hudStageNum').textContent = String(stage.num).padStart(2, '0');
  el('hudStageTitle').textContent = stage.name;
  
  const keyBadge = el('hudKeyBadge');
  if (state.hasKey) {
    keyBadge.textContent = '🔑 열쇠 보유중';
    keyBadge.className = 'key-badge has-key';
  } else {
    keyBadge.textContent = '🔒 열쇠 미보유';
    keyBadge.className = 'key-badge';
  }
}

function showWin() {
  el('winPanel').classList.remove('hidden');
}

el('btnRestart').onclick = () => {
  state.stageIdx = 0; state.hasKey = false; state.player.x = 100; state.player.y = 240; state.follower.x = 70; state.follower.y = 240;
  el('winPanel').classList.add('hidden');
  updateHud();
};

updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
